name: CI

on:
  push:
  pull_request:

jobs:
  triage-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: triage-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and run unit tests
        run: mvn -B test

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Type-check and build
        run: npm run build
